<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox justify</title>
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            background-color:mediumturquoise;
            justify-content:space-evenly;
            /* justify-content: center; */
        }

        .flex-container > div {
            background-color: #f1f1f1;
            width: 50px;
            margin: 10px;
            padding: 10px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <h1>Using Flexbox justify</h1>

    <div class="flex-container">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
      <div>Item 4</div>
    </div>
</body>

</html>
