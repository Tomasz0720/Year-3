<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid auto</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 60px 150px auto 50px;
            grid-template-rows: 80px 150px;
            gap: 10px;
            background-color:hotpink;
            padding: 10px;
        }

        /* Apply style to all divs that are *children> of grid container */
        .grid-container > div {
            /* White at 80% alpha */
            background-color: rgba(255 255 255 / 0.8);
            text-align: center;
            padding: 20px;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <h1>Grid template</h1>

    <p>Use <em>grid-template-columns</em> to specify the size of each column.</p>

    <div class="grid-container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
    </div>
</body>

</html>
