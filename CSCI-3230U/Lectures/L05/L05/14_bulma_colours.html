<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <title>Bulma colours</title>
</head>

<body>
    <!-- Changing colours -->
    <!-- https://bulma.io/documentation/helpers/color-helpers/ -->
    <h1 class="is-size-4 has-text-centered">Font colours</h1>
    <p class="has-text-primary">Primary text</p>
    <p class="has-text-link ">Link text</p>
    <p class="has-text-info">Info text</p>
    <p class="has-text-success">Success text</p>
    <p class="has-text-warning">Warning text</p>
    <p class="has-text-danger">Danger text</p>

    <!-- Button colours -->
    <!-- https://bulma.io/documentation/elements/button/ -->
    <h1 class="is-size-4 has-text-centered">Button colours</h1>
    <div class="buttons">
        <button class="button is-primary">Primary</button>
        <button class="button is-link">Link</button>
      </div>
      
      <div class="buttons">
        <button class="button is-info">Info</button>
        <button class="button is-success">Success</button>
        <button class="button is-warning">Warning</button>
        <button class="button is-danger">Danger</button>
      </div>
</body>

</html>
