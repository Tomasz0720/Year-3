<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A basic 3x2 Grid</title>
    <style>
        .my-fancy-grid-container {
            display: grid;
            /* 3 columns, auto spacing to fit the page */
            grid-template-columns: auto auto auto;
            background-color:blue;
            padding: 10px;
        }

        .grid-item {
            /* White at 90% transparency */
            background-color: rgba(255 255 255 / 0.5);
            border: 1px solid black;
            padding: 20px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>A CSS grid layout</h1>

    <p>The parent element must have the <em>display</em> property set to <em>grid</em> or
        <em>inline-grid</em>.</p>

    <p>Child element(s) of the grid container automatically becomes grid items.</p>

    <div class="my-fancy-grid-container">
        <div class="grid-item">Item 1</div>
        <div class="grid-item">Item 2</div>
        <div class="grid-item">Item 3</div>
        <div class="grid-item">Item 4</div>
        <div class="grid-item">Item 5</div>
        <div class="grid-item">Item 6</div>
    </div>
</body>

</html>
