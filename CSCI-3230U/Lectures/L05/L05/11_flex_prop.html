<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox properties</title>
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            /* flex-wrap: nowrap; */
            flex-wrap: wrap;
            background-color:plum;
        }

        .flex-container > div {
            background-color: #f1f1f1;
            width: 50px;
            margin: 10px;
            padding: 10px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <h1>Using Flexbox Properties</h1>

    <div class="flex-container">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
      <div>Item 4</div>
      <div>Item 5</div>
      <div>Item 6</div>
      <div>Item 7</div>
      <div>Item 8</div>
      <div>Item 9</div>
      <div>Item 10</div>
      <div>Item 11</div>
      <div>Item 12</div>  
    </div>
</body>

</html>
