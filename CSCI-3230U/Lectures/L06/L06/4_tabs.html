<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" 
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" 
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" 
    crossorigin="anonymous"></script>
        
    <title>Tabbed page</title>
    <script>
        $(document).ready(function () {

            // Check for click events on the navbar burger icon
            $(".navbar-burger").click(function () {

                // Toggle the "is-active" class on both the "navbar-burger" and the "navbar-menu"
                $(".navbar-burger").toggleClass("is-active");
                $(".navbar-menu").toggleClass("is-active");

            });
        });
    </script>
</head>

<body>
    <!-- navbar colours: https://bulma.io/documentation/components/navbar/#colors -->
    <nav class="navbar" role="navigation" aria-label="main navigation">

        <!-- navbar-brand -->
        <div class="navbar-brand">
            <a class="navbar-item" href="#">
                <img src="images/logo.png" width="60" height="70" alt="Bug Pharma Logo" />
            </a>

            <!-- Burger item -->
            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false"
                data-target="navbarBasicExample">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>

        <!-- navbar-menu -->
        <div id="navbarBasicExample" class="navbar-menu">
            <!-- nav-Start -->
            <div class="navbar-start">
                <!-- Item 1: Home -->
                <a class="navbar-item" href="#">Home</a>

                <!-- Item 2: Dropdown menu -->
                <div class="navbar-item has-dropdown is-hoverable">
                    <a class="navbar-link">Products</a>
                    <div class="navbar-dropdown">
                        <a class="navbar-item" href="#">Rad Grow</a>
                        <a class="navbar-item" href="#">Fire Breath</a>
                        <hr class="navbar-divider" />
                        <a class="navbar-item" href="#">Armour Plating</a>
                        <a class="navbar-item" href="#">Chobham Armour</a>
                        <a class="navbar-item" href="#">Ceraminc composite</a>
                    </div>
                </div>

                <!-- Item 3: Contact -->
                <a class="navbar-item" href="#">Contact Us</a>
            </div>

            <!-- nav-End -->
            <div class="navbar-end">
                <div class="navbar-item">
                    <div class="buttons">
                        <a class="button is-danger">Sign-Up</a>
                        <a class="button is-light">Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero banner -->
    <section class="hero is-primary">
        <div class="hero-body">
            <p class="title">
                Bug Pharma has a treatment for you
            </p>
            <p class="subtitle">
                Soylent green now available
            </p>
        </div>
    </section>

    <!-- Tabs  -->
    <div class="tabs">
        <ul>
            <!-- Simple tabs -->
            <!-- <li class="is-active" onclick="openTab(event, 'table')">
                <a>Table of Controls</a>
            </li>
            <li onclick="openTab(event, 'card')">
                <a>Card</a>
            </li>
            <li onclick="openTab(event, 'panel')">
                <a>Panel</a>
            </li>
            <li onclick="openTab(event, 'form')">
                <a>Form</a>
            </li> -->

            <li class="is-active" onclick="openTab(event, 'table')">
                <a>
                    <!-- Icon -->
                    <span class="icon is-small"><i class="fa-solid fa-table-list"></i></span>
                    <span>Table of controls</span>
                  </a>
            </li>

            <li onclick="openTab(event, 'card')">
                <a>
                    <!-- Icon -->
                    <span class="icon is-small"><i class="fa-regular fa-address-card"></i></span>
                    <span>Card</span>
                </a>
            </li>
            
        </ul>
    </div>

</body>

</html>
