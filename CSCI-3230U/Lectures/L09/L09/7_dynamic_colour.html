  <title>Dynamic colour</title>

<body>
  <h1>Click a &lt;p&gt; element to change its font color.</h1>
  <p class="details">Here's some paragraph text.</p>

  <ul id='myList'>
    <li class='odd'>List item one</li>
    <li class='even'>List item two</li>
    <li class='odd'>List item three</li>
  </ul>

  <p class="details">Some more text for colouring</p>
  <p class="blue" id="blueID">Use native JavaScript for this one</p>
  <p class="final">Last one.</p>

</body>
