<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Example</title>
    <!-- Notice the use of defer here - load the page, then run JS -->
    <script src="scripts/1_dom_element.js" defer></script>
</head>

<body>
    <h3>Open your browser's JavaScript console</h3>

    <p>Text, some <em>emphasised</em></p>
    <ul id='myID'>
        <li class='odd'>List item one</li>
        <li class='even'>List item two</li>
        <li class='odd'>List item three</li>
    </ul>
    
    <!-- What happens to our list colours here? -->
    <ul id='list2'>
        <li class='odd'>Another</li>
        <li class='even'>list</li>
        <li class='odd'>of items</li>
        <li class='Even'>yeah</li>
    </ul>
</body>
</html>
